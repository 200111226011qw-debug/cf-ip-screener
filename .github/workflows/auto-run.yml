name: 定时筛选纯净IP

on:
  workflow_dispatch:          # 手动触发
    inputs:
      extra_args:
        description: "追加给 main.py 的命令行参数（限流实验用）。不要加引号——引号会被原样传进去，URL 会变成带引号字符的坏地址。例：--limit 150 --speed-rounds 1 --speed-url https://speed.cloudflare.com/__down?bytes=262144"
        required: false
        default: ""
      label:
        description: "本次运行标签（记进日志，便于区分实验组）"
        required: false
        default: ""
  schedule:                   # 定时触发：每 2 小时第 5 分钟（一天 12 次）
    - cron: "5 */2 * * *"    # 一轮完整跑约 7.4 分钟，2 小时间隔保证不撞 concurrency

# 并发控制：同一时间只允许一个 workflow 运行
concurrency:
  group: cf-screener
  cancel-in-progress: false

permissions:
  contents: write
  issues: write             # 连续空结果达阈值时开 issue 告警

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # 防止某个池 hang 导致 job 挂数小时
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      # 定位项目根目录：main.py 必须在仓库根目录，或唯一的子目录中。
      # GitHub 网页上传若拖了整个文件夹，会把项目嵌进一层子目录，
      # 这里自动进入该子目录继续跑；找不到则列出实际结构并报错。
      - name: 定位项目根目录
        run: |
          if [ -f main.py ]; then
            echo "main.py 在仓库根目录，无需调整"
            exit 0
          fi
          echo "main.py 不在仓库根目录，当前文件结构："
          find . -maxdepth 3 -type f | sort
          DIR=$(find . -maxdepth 2 -name main.py -exec dirname {} \; | head -1)
          if [ -n "$DIR" ]; then
            echo "已在子目录 $DIR 找到项目，自动进入该目录"
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          else
            echo "::error::仓库根目录下找不到 main.py，请确认项目文件位于仓库根目录（main.py、config.py、screener/、.github/workflows/ 等）。若上传时嵌套了一层文件夹，请把其中的文件移到仓库根目录后重试"
            exit 1
          fi

      # 单 job 一次跑出总表 + 三运营商分表 + 其他：
      # 不拆矩阵，避免多 job 并发写同一批 result/ 文件导致 rebase 冲突
      - name: 运行筛选（全运营商）
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          RUN_LABEL: ${{ inputs.label }}
        run: |
          cd "${PROJECT_DIR:-.}"
          if [ -n "$RUN_LABEL" ]; then
            echo "### 本次运行标签: $RUN_LABEL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$EXTRA_ARGS" ]; then
            echo "### 追加参数: $EXTRA_ARGS" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 去掉参数里的引号：$EXTRA_ARGS 是「参数展开」的结果，bash 的
          # 引号移除**不作用于**展开结果——用户照习惯写了引号，引号会
          # 原样进到 main.py，URL 变成 "https://..."（带引号字符）→
          # 主机名解析失败 → 全部 400/连接失败。实测踩过这个坑。
          EXTRA_ARGS=$(printf '%s' "$EXTRA_ARGS" | tr -d '"'"'"'')
          # tee 到 run.log 便于抓关键指标；pipefail + PIPESTATUS 保住
          # main.py 的退出码（空结果守卫靠它让工作流失败）
          set -o pipefail
          # shellcheck disable=SC2086
          python main.py --top-n 50 $EXTRA_ARGS 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 关键指标"
            grep -aE "首轮 HTTP 状态码|首轮失败归因|在飞下载峰值|出口 IP|收满门禁|已连续 .* 轮空结果|纯净可用" run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 上传报告 artifact
        # if: always()：主流程失败（如空结果守卫触发）时也要上传报告，
        # 否则排障时拿不到本轮的漏斗与归因数据。
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: result
          # 注意：path 不支持 shell 变量展开（${PROJECT_DIR:-.} 会被当字面路径），
          # 必须用 GitHub Actions 表达式：未设置 PROJECT_DIR 时回退到仓库根目录 .
          path: ${{ env.PROJECT_DIR || '.' }}/result/

      - name: 提交结果
        # **显式 success()**：只有前面的步骤全成功才提交。
        # 失败时（空结果守卫退出码 3 / 对齐契约破坏的 RuntimeError 退出码 1
        # / 其它异常）**一律不提交**——失败轮的 result/ 可能是空的、也可能
        # 是「候选与测速结果配错」的坏数据，提交上去比不提交更糟。
        # （默认行为本来就是「前序失败则跳过」，这里写出来是为了防止将来
        #  有人照抄上面 artifact 步骤的 `if: always()` 到这一步。）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULT_DIR="${PROJECT_DIR:+$PROJECT_DIR/}result/"
          # result/ 在 .gitignore 中，用 -f 强制加入（结果文件本就是要入库的产物）
          git add -f "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新优选 IP 结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 偶发的并发 push（如手动触发与本地/其他 push 竞争）先 rebase 再 push。
          # -X ours：rebase 冲突时自动偏向本 run 新生成的结果文件。
          # 仓库中只有 result/ 是自动生成的产物，其余文件由人工维护且工作流
          # 不会改动它们，因此“结果文件优先”的冲突策略安全。
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours && git push; then
              exit 0
            fi
            sleep 3
          done
          echo "连续 3 次 push 失败，请手动检查"
          echo "--- 当前 git 状态 ---"
          git status --short | head -30
          exit 1

      # 连续空结果告警：CI 变红是给「看 CI 历史的人」看的，定时任务没人盯。
      # 这一步保证「连续 N 轮空结果」会**主动**开 issue（不看 CI 也能知道），
      # 恢复正常后自动关闭。
      - name: 空结果连击与告警
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD: "3"
        run: |
          cd "${PROJECT_DIR:-.}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE=".ci-state.json"
          STREAK=0
          if [ -f "$STATE" ]; then
            STREAK=$(python -c "import json;print(int(json.load(open('$STATE')).get('empty_streak',0)))" 2>/dev/null || echo 0)
          fi
          echo "连续空结果轮数: $STREAK（阈值 $THRESHOLD）"
          # 状态文件由 main.py 更新（只在连击数变化时重写）；这里只负责提交
          git add -f "$STATE" 2>/dev/null || true
          if ! git diff --cached --quiet -- "$STATE"; then
            git commit -m "ci: 空结果连击计数 $STREAK" || true
            git pull --rebase --autostash -X ours >/dev/null 2>&1 || true
            git push || echo "状态文件 push 失败（不影响告警）"
          fi
          # 达到阈值 → 开 issue（已有同类 issue 则不重复开）
          if [ "$STREAK" -ge "$THRESHOLD" ]; then
            EXIST=$(gh issue list --state open --search "空结果连击" --json number --jq '.[].number' 2>/dev/null | head -1 || true)
            if [ -z "$EXIST" ]; then
              gh issue create \
                --title "[告警] 连续 $STREAK 轮空结果（纯净 0 条）" \
                --body "自动筛选已连续 $STREAK 轮产出 0 条纯净 IP。常见原因：Cloudflare 风控（429）把测速全部拦下。排障见本轮 workflow 日志的「首轮失败归因」与「在飞下载峰值」。恢复后本 issue 会自动关闭。" \
                || echo "开 issue 失败"
            else
              echo "已有告警 issue #$EXIST，跳过重复创建"
            fi
          elif [ "$STREAK" -eq 0 ]; then
            # 恢复正常 → 关闭告警 issue
            for n in $(gh issue list --state open --search "空结果连击" --json number --jq '.[].number' 2>/dev/null || true); do
              gh issue close "$n" --comment "已恢复：本轮产出正常，空结果连击归零。" || true
            done
          fi
