name: Validate Clash YAML with Mihomo

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 */4 * * *'  # UTC: 00/04/08/12/16/20 → 北京时间 08/12/16/20/00/04

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Generate clash.yaml (10 candidates, no speedtest)
        run: python main.py --limit 10 --no-speed
      - name: Verify clash.yaml exists
        run: |
          test -f result/clash_proxies.yaml
          echo "--- head of clash.yaml ---"
          head -20 result/clash_proxies.yaml
      - name: Download mihomo (latest amd64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # runner 的出口 IP 是共享的：未认证的 api.github.com 限流是
          # 60 次/小时/IP（不是每仓库），2026-10-22 16:33 UTC 就这样吃过 403。
          # 带 token 后按 token 计（5000 次/小时），并重试 5xx。
          RESP=$(curl -fsSL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          echo "--- available assets ---"
          echo "$RESP" | jq -r '.assets[].name'
          URL=$(echo "$RESP" | jq -r '.assets[]
            | select(.name | startswith("mihomo-linux-amd64-"))
            | select(.name | endswith(".gz"))
            | select(.name | contains("compatible") | not)
            | .browser_download_url' | head -1)
          if [ -z "$URL" ]; then
            echo "No matching mihomo asset." >&2
            exit 1
          fi
          echo "Downloading: $URL"
          curl -fsSL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v
      - name: Validate config with mihomo (-t test mode)
        run: ./mihomo -t -f result/clash_proxies.yaml
